# Run 01: custom_unet · 3-class · CE loss · random sampling · 256px patches
# ── Data ──────────────────────────────────────────────────────────────────────
data_dir: /home/lding/lding/data/cara_data/reformrequest
patch_size: 256
patches_per_image: 100
val_image_idx: 3
seed: 42

# ── Segmentation ──────────────────────────────────────────────────────────────
binary: false

# ── Model ─────────────────────────────────────────────────────────────────────
model: custom_unet
base_features: 64

# ── Training ──────────────────────────────────────────────────────────────────
loss: ce
annotated_fraction: 0.0
aug_elastic: false
aug_intensity: false

batch_size: 8
num_workers: 4
lr: 1.0e-4
weight_decay: 1.0e-4
epochs: 100
save_every: 10

# ── Output ────────────────────────────────────────────────────────────────────
output_dir: ./outputs/run01_customunet_3cls_ce_random_256px
